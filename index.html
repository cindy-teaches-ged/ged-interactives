<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GED/HiSET Interactives — Learning Resources</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1A1A2E;
            --paper: #F8F6F1;
            --accent: #2D5BE3;
            --accent-light: #E8EEFB;
            --highlight-green: #1B7F4E;
            --green-bg: #D6F0E3;
            --muted: #6B7280;
            --border: #DDD8CF;
            --radius: 10px;
        }
 
        * { margin: 0; padding: 0; box-sizing: border-box; }
 
        body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
 
        .header {
            background: var(--ink);
            color: #fff;
            padding: 3rem 1.5rem 2.5rem;
            text-align: center;
        }
 
        .header-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2rem, 5vw, 3rem);
            letter-spacing: .06em;
            color: #FFD166;
            line-height: 1;
            margin-bottom: .5rem;
        }
 
        .header-sub {
            font-size: 16px;
            color: #A0A8C0;
            letter-spacing: .02em;
            max-width: 600px;
            margin: 0 auto;
        }
 
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }
 
        .prompt {
            text-align: center;
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 2rem;
        }
 
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.75rem;
        }
 
        .subject-tile {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem 2rem;
            text-align: center;
            text-decoration: none;
            color: var(--ink);
            transition: all .3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
 
        .subject-tile:hover {
            border-color: var(--accent);
            box-shadow: 0 10px 28px rgba(45, 91, 227, .14);
            transform: translateY(-4px);
        }
 
        .subject-icon { font-size: 3rem; margin-bottom: 1rem; }
 
        .subject-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.75rem;
            letter-spacing: .04em;
            margin-bottom: .6rem;
        }
 
        .subject-desc {
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--muted);
            margin-bottom: 1.5rem;
        }
 
        .subject-count {
            font-size: 12.5px;
            color: #999;
            margin-bottom: 1rem;
        }
 
        .subject-enter {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: .65rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
        }
 
        .subject-tile:hover .subject-enter { background: #1E45C5; }
 
        .empty-note {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            padding: 2rem;
        }
 
        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--muted);
            font-size: 13px;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }
    </style>
</head>
<body>
 
<div class="header">
    <div class="header-title">GED Interactives</div>
    <div class="header-sub">Master GED/HiSET skills with interactive learning activities — designed for practice and mastery.</div>
</div>
 
<div class="container">
    <p class="prompt">Choose a subject to see its activities.</p>
    <div class="subject-grid" id="subjectGrid"></div>
</div>
 
<footer>
    <p>© 2026 GED Interactives. All rights reserved. Designed for GED learners.</p>
</footer>
 
<script src="activities.js"></script>
<script>
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}
 
function render() {
  const grid = document.getElementById('subjectGrid');
  if (!SUBJECTS || SUBJECTS.length === 0) {
    grid.innerHTML = '<div class="empty-note">No subjects yet — add one to SUBJECTS in activities.js.</div>';
    return;
  }
  grid.innerHTML = SUBJECTS.map(s => {
    const count = ACTIVITIES.filter(a => a.subject === s.key).length;
    const countLabel = count === 0 ? 'Coming soon' : `${count} activit${count === 1 ? 'y' : 'ies'}`;
    return `
      <a href="subject.html?key=${encodeURIComponent(s.key)}" class="subject-tile">
        <div class="subject-icon">${s.icon}</div>
        <div class="subject-name">${escapeHtml(s.name)}</div>
        <div class="subject-desc">${escapeHtml(s.description)}</div>
        <div class="subject-count">${countLabel}</div>
        <span class="subject-enter">Enter →</span>
      </a>`;
  }).join('');
}
 
render();
</script>
 
</body>
</html>
