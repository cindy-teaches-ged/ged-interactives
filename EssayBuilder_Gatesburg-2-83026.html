<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Your Essay</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF7F2; --card: #FFFFFF; --border: #E4DFD5;
  --teal: #1B8A7E; --teal-dark: #0F5C53; --amber: #C77D22;
  --text: #2A2A28; --muted: #6B6862; --green: #2E8B57;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 17px; line-height: 1.7; min-height: 100vh; padding: 1.5rem 1rem 3rem; }
.wrap { max-width: 1100px; margin: 0 auto; }

.header { text-align: center; margin-bottom: 1.5rem; }
.header h1 { font-size: 1.5rem; font-weight: 700; color: var(--teal-dark); margin-bottom: .3rem; }
.header p { color: var(--muted); font-size: 15px; }

.dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 2rem; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); transition: background .2s; }
.dot.active { background: var(--teal); width: 24px; border-radius: 5px; }
.dot.done { background: var(--green); }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem 1.5rem; margin-bottom: 1.25rem; }
.q-label { font-size: 13px; font-weight: 600; color: var(--teal); text-transform: uppercase; letter-spacing: .04em; margin-bottom: .6rem; }
.q-text { font-size: 19px; font-weight: 600; line-height: 1.5; margin-bottom: .3rem; }
.sentence-hint { font-size: 13.5px; color: var(--muted); margin-bottom: .9rem; }
.quote-note { background: rgba(199,125,34,.08); border: 1px solid rgba(199,125,34,.3); border-radius: 8px; padding: .7rem .9rem; font-size: 13.5px; color: var(--amber); margin-bottom: .9rem; }
textarea { width: 100%; min-height: 90px; padding: .85rem 1rem; border: 2px solid var(--border); border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 16px; line-height: 1.6; color: var(--text); resize: vertical; }
textarea:focus { outline: none; border-color: var(--teal); }
.error { color: #B23A3A; font-size: 14px; margin-top: .5rem; display: none; }
.error.show { display: block; }
.multi-warning { display: none; background: rgba(199,125,34,.1); border: 1px solid rgba(199,125,34,.35); border-radius: 8px; padding: .65rem .85rem; font-size: 13.5px; color: var(--amber); margin-top: .6rem; }
.multi-warning.show { display: block; }

.btn-row { display: flex; gap: .75rem; margin-top: 1.25rem; }
.btn { flex: 1; padding: .9rem 1rem; border-radius: 10px; border: none; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; min-height: 48px; }
.btn-primary { background: var(--teal); color: #fff; }
.btn-primary:hover { background: var(--teal-dark); }
.btn-secondary { background: transparent; border: 2px solid var(--border); color: var(--muted); flex: 0 0 auto; padding-left: 1.5rem; padding-right: 1.5rem; }
.btn-secondary:hover { border-color: var(--muted); color: var(--text); }

.result-card { background: var(--card); border: 2px solid var(--teal); border-radius: var(--radius); padding: 1.75rem 1.5rem; margin-bottom: 1.5rem; }
.result-title { font-size: 15px; font-weight: 700; color: var(--teal-dark); margin-bottom: 1rem; }
.result-para { width: 100%; min-height: 140px; padding: 1rem; border: 2px solid var(--border); border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 16px; line-height: 1.8; color: var(--text); background: #FDFCFA; resize: vertical; }

.reveal-title { font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 1.75rem 0 .75rem; }
.reveal-row { display: flex; gap: 10px; align-items: flex-start; padding: .6rem 0; border-bottom: 1px solid var(--border); }
.reveal-row:last-child { border-bottom: none; }
.reveal-tag { flex: 0 0 140px; font-size: 13px; font-weight: 700; color: var(--amber); }
.reveal-txt { font-size: 14.5px; color: var(--muted); line-height: 1.6; }

.copy-btn { width: 100%; padding: 1rem; border-radius: 10px; border: none; background: var(--teal); color: #fff; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: .5rem; min-height: 48px; }
.copy-btn:hover { background: var(--teal-dark); }
.copy-btn.copied { background: var(--green); }
.copy-help { font-size: 13.5px; color: var(--muted); margin-top: .6rem; text-align: center; margin-bottom: 1.5rem; }

.text-btn { display: block; width: 100%; text-align: center; margin-top: 1rem; padding: .75rem; border-radius: 10px; border: 2px solid var(--border); background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 15px; cursor: pointer; }
.text-btn:hover { border-color: var(--muted); color: var(--text); }

.preview-box { background: rgba(27,138,126,.06); border: 1px dashed var(--teal); border-radius: 10px; padding: 1rem 1.1rem; margin-bottom: 1.25rem; font-size: 15px; line-height: 1.7; color: var(--teal-dark); display: none; }
.preview-box.show { display: block; }
.preview-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--teal); margin-bottom: .5rem; }
.preview-draft { color: var(--muted); font-style: italic; }

.back-link { display: inline-block; margin-bottom: 1rem; color: var(--muted); font-size: 14px; cursor: pointer; text-decoration: underline; }
.back-link:hover { color: var(--text); }

/* Home screen */
.section-list { display: flex; flex-direction: column; gap: .85rem; margin-bottom: 1.5rem; }
.section-card { background: var(--card); border: 2px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.4rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: border-color .15s; }
.section-card:hover { border-color: var(--teal); }
.section-card.complete { border-color: rgba(46,139,87,.4); background: rgba(46,139,87,.05); }
.section-name { font-size: 17px; font-weight: 600; }
.section-status { font-size: 13px; font-weight: 600; padding: .3rem .8rem; border-radius: 20px; background: var(--border); color: var(--muted); }
.section-status.progress { background: rgba(199,125,34,.15); color: var(--amber); }
.section-status.complete { background: rgba(46,139,87,.15); color: var(--green); }

.essay-btn { width: 100%; padding: 1.1rem; border-radius: var(--radius); border: none; background: var(--teal-dark); color: #fff; font-family: 'DM Sans', sans-serif; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: .5rem; }
.essay-btn:hover { background: #0A4A43; }

.essay-missing { background: rgba(199,125,34,.08); border: 1px solid rgba(199,125,34,.3); border-radius: 10px; padding: 1rem 1.1rem; font-size: 14.5px; color: var(--amber); margin-bottom: 1.25rem; }
.save-warning {
  background: #B23A3A;
  border: none;
  border-radius: 10px;
  padding: .85rem 1.1rem;
  margin-bottom: 1.25rem;
  color: #FFFFFF;
  font-family: 'Arial Narrow', 'Arial', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .02em;
  line-height: 1.55;
}
.save-warning .warning-title { font-size: 13.5px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: .5rem; }
.save-warning ul { margin: 0; padding-left: 1.1rem; }
.save-warning li { margin-bottom: .3rem; }
.save-warning li:last-child { margin-bottom: 0; }

.info-box {
  background: rgba(27,138,126,.08);
  border: 1px solid rgba(27,138,126,.3);
  border-radius: 10px;
  padding: .95rem 1.15rem;
  margin-bottom: 1.25rem;
  color: var(--teal-dark);
  font-size: 14px;
  line-height: 1.6;
}
.info-box .info-title { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .5rem; color: var(--teal); }
.info-box ul { margin: 0; padding-left: 1.2rem; }
.info-box li { margin-bottom: .35rem; }
.info-box li:last-child { margin-bottom: 0; }
.essay-section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--teal); margin: 1.25rem 0 .4rem; }
.essay-section-label:first-child { margin-top: 0; }

/* Split layout: passage panel + question panel */
.main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; }
.question-panel { min-width: 0; }

.mobile-toggle-row { display: none; justify-content: center; margin-bottom: 1.25rem; }
.mobile-toggle-btn { padding: .7rem 1.4rem; border-radius: 999px; border: 2px solid var(--teal); background: var(--card); color: var(--teal-dark); font-family: 'DM Sans', sans-serif; font-size: 14.5px; font-weight: 700; cursor: pointer; }
.mobile-toggle-btn:hover { background: rgba(27,138,126,.08); }

.passage-panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.passage-panel-header { padding: 1rem 1.25rem .85rem; border-bottom: 1px solid var(--border); }
.passage-panel-title { font-size: 12.5px; font-weight: 700; color: var(--teal); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .7rem; }
.passage-tab-row { display: flex; gap: .5rem; flex-wrap: wrap; }
.passage-tab-btn { padding: .45rem .95rem; border-radius: 999px; border: 2px solid var(--border); background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.passage-tab-btn.active { border-color: var(--teal); color: var(--teal-dark); background: rgba(27,138,126,.08); }
.passage-scroll { padding: 1.15rem 1.35rem; overflow-y: auto; max-height: 65vh; font-size: 15px; line-height: 1.75; color: var(--text); }
.passage-scroll::-webkit-scrollbar { width: 8px; }
.passage-scroll::-webkit-scrollbar-thumb { background: rgba(27,138,126,.3); border-radius: 4px; }
.passage-scroll h3 { font-size: 16.5px; font-weight: 700; color: var(--teal-dark); margin-bottom: .85rem; }
.passage-scroll p { margin-bottom: .95rem; }
.passage-para-num { color: var(--amber); font-weight: 700; font-size: 12.5px; margin-right: 4px; }

@media (max-width: 860px) {
  .main-layout { display: block; }
  .mobile-toggle-row { display: flex; }
  .passage-panel { display: none; margin-bottom: 1.25rem; }
  .passage-panel.mobile-show { display: flex; }
  .question-panel.mobile-hide { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1 id="pageTitle">Build Your Essay</h1>
    <p id="pageSubtitle">Pick a paragraph to work on. Answer in your own words — no wrong answers.</p>
  </div>

  <div class="mobile-toggle-row">
    <button class="mobile-toggle-btn" id="mobileToggleBtn" onclick="toggleMobileView()">📄 Show Passages</button>
  </div>

  <div class="main-layout">
    <div class="passage-panel" id="passagePanel">
      <div class="passage-panel-header">
        <div class="passage-panel-title">Reading Passages</div>
        <div class="passage-tab-row">
          <button class="passage-tab-btn active" id="ptab-pro" onclick="showPassage('pro')">Pro Recycling Law</button>
          <button class="passage-tab-btn" id="ptab-no" onclick="showPassage('no')">No New Law</button>
        </div>
      </div>
      <div class="passage-scroll" id="passageBody"></div>
    </div>
    <div class="question-panel" id="questionPanel">
      <div id="app"></div>
    </div>
  </div>
</div>

<script>
const SECTIONS = [
  { key: 'intro', label: 'Introduction', questions: [
    { tag: 'Zoom Out', q: "What's a bigger problem, anywhere, that connects to trash and recycling — something true even if Gatesburg didn't exist?", hint: "Write this as one complete sentence.", isQuote: false },
    { tag: 'The Contenders', q: "One article argues the recycling law is a good idea. The other argues it isn't. In your own words, what is each one actually saying?", hint: "One sentence, in your own words — don't copy text from the passages here.", isQuote: false },
    { tag: 'Your Position', q: "Which side do you actually agree with?", hint: "Write this as one complete sentence.", isQuote: false },
    { tag: 'The Bridge', q: "Why does the bigger problem from Question 1 matter here, specifically in Gatesburg?", hint: "Write this as one complete sentence.", isQuote: false },
    { tag: 'Preview', q: "What are two reasons someone should agree with your position?", hint: "Write this as one complete sentence.", isQuote: false },
  ]},
  { key: 'body1', label: 'Body Paragraph 1', questions: [
    { tag: 'Topic Sentence', q: "What is one reason (from your Introduction's Preview) that supports your position?", hint: "One sentence, in your own words.", isQuote: false },
    { tag: 'Evidence (your words)', q: "In your own words, what fact from the Go Gatesburg passage supports this reason?", hint: "One sentence, in your own words — don't copy the passage text here.", isQuote: false },
    { tag: 'Evidence (direct quote)', q: "Now write one sentence of your own that includes a short quoted phrase from the Go Gatesburg passage.", hint: "Add the quotation marks yourself, around just the part you're borrowing — the rest should be your own words. Keep the quoted part short.", isQuote: true },
    { tag: 'Bridge', q: "Why does this evidence matter to your position?", hint: "One sentence, in your own words.", isQuote: false },
  ]},
  { key: 'body2', label: 'Body Paragraph 2', questions: [
    { tag: 'Topic Sentence', q: "What is your second reason (from your Introduction's Preview) that supports your position?", hint: "One sentence, in your own words — a different reason than Body Paragraph 1.", isQuote: false },
    { tag: 'Evidence (your words)', q: "In your own words, what fact from the Go Gatesburg passage supports this second reason?", hint: "One sentence, in your own words — don't copy the passage text here.", isQuote: false },
    { tag: 'Evidence (direct quote)', q: "Now write one sentence of your own that includes a short quoted phrase from the Go Gatesburg passage.", hint: "Add the quotation marks yourself, around just the part you're borrowing — the rest should be your own words. Keep the quoted part short.", isQuote: true },
    { tag: 'Bridge', q: "Why does this evidence matter to your position?", hint: "One sentence, in your own words.", isQuote: false },
  ]},
  { key: 'counter', label: 'Counterargument', questions: [
    { tag: 'Topic Sentence', q: "What is the strongest point someone on the other side (the No Laws passage) would make?", hint: "One sentence, in your own words.", isQuote: false },
    { tag: 'Evidence (your words)', q: "In your own words, what does the No Laws passage say to support that point?", hint: "One sentence, in your own words — don't copy the passage text here.", isQuote: false },
    { tag: 'Evidence (direct quote)', q: "Now write one sentence of your own that includes a short quoted phrase from the No Laws passage.", hint: "Add the quotation marks yourself, around just the part you're borrowing — the rest should be your own words. Keep the quoted part short.", isQuote: true },
    { tag: 'Rebuttal', q: "Even with that point, why does your position still hold up?", hint: "One sentence, in your own words. A good start: \"However...\" or \"Still...\"", isQuote: false },
  ]},
  { key: 'conclusion', label: 'Conclusion', questions: [
    { tag: 'Restated Position', q: "Restate your position in new words — don't just repeat your intro sentence.", hint: "One sentence, in your own words.", isQuote: false },
    { tag: 'Recap', q: "Briefly recap your two reasons.", hint: "One sentence naming both reasons.", isQuote: false },
    { tag: 'Final Thought', q: "End with one sentence on why this matters going forward.", hint: "One sentence, in your own words.", isQuote: false },
  ]},
];

const PASSAGES = {
  pro: {
    label: 'Pro Recycling Law',
    title: 'Going Green for Gatesburg',
    paragraphs: [
      "The GatesburgGoGreen Initiative is a joint proposal crafted by environmental groups, businesses, city officials, and citizens. The goal is to reduce the amount of waste we add to the county landfill by 90% over the next five years. This plan is ambitious but achievable. It is a goal shared by cities like San Francisco and Cleveland, both of which are much larger than Gatesburg.",
      "The proposal began as a discussion about extending the life of the county landfill, which will close in ten years if we do nothing. Several years ago, the city banned the dumping of construction waste, such as wood, that can be effectively recycled. The city later banned yard waste and started a composting program for leaves and grass clippings. Requiring recycling and composting is nothing new. We are just taking the idea to the next level to save our landfill.",
      "The new plan calls for every resident to have three trashcans: a green one for compost such as food waste, a blue one for recyclable paper and plastic, and a black one for the landfill. According to the Environmental Protection Agency, the average American produces more than four pounds of trash each day and recycles only about a third of that amount. Those daily pounds of trash add up. They result in tons added unnecessarily to our landfill each year.",
      "Purchasing bins and hiring staff will cost money. However, those investments will pay dividends. The city will follow the example of Phoenix, Arizona, which has made more than 500 million dollars in a year by selling its recyclables. We will produce compost that citizens can use in their gardens. We will save money by not having to open a new landfill. We will improve the environment and our budget at the same time."
    ]
  },
  no: {
    label: 'No New Law',
    title: 'No Recycling Laws for Gatesburg',
    paragraphs: [
      "Recycling is a great idea. Americans already recycle at a high rate, which is around 95% of lead-acid batteries and 70% of steel cans and newspapers. That is one reason we oppose the GatesburgGoGreen Initiative. It burdens citizens by taking a good idea to ridiculous extremes.",
      "The so-called initiative is a law, plain and simple. If passed, it would criminalize violations of its complicated rules. A newspaper goes into the blue bin, but what about a flyer insert? Well, it depends. Coffee grounds go in the green bin, but what about a plastic container of yogurt that has gone out of date? Careful — make a mistake, and you will be fined. Those fines, along with the increased taxes to pay for the services and personnel, make this a bad idea for taxpayers.",
      "Privacy is another concern. The proposal requires that radio-frequency identification computer chips be attached to each bin. These chips track the pounds of trash each person discards versus how much is recycled. City officials know the average weights thrown out per day, and they know what the numbers should be with mandatory recycling and composting. Falling outside of acceptable ranges summons the trash police to check your bins to see if you have thrown a banana peel into the trash bin instead of the compost bin. The law calls for \u201cadministrative personnel\u201d who will have the authority to write tickets. If we aren\u2019t careful, Gatesburg will start to feel like the United Kingdom. In some locations in the UK, compliance with trash laws is monitored with surveillance cameras.",
      "This proposed law is not only unnecessary but also radical in how it sacrifices the needs and comfort of citizens to reach an impossible ideal. We already recycle, and we do not need a law forcing us to go beyond what is reasonable."
    ]
  }
};

function showPassage(id) {
  const p = PASSAGES[id];
  document.getElementById('ptab-pro').classList.toggle('active', id === 'pro');
  document.getElementById('ptab-no').classList.toggle('active', id === 'no');
  let html = `<h3>${p.title}</h3>`;
  p.paragraphs.forEach((para, i) => {
    html += `<p><span class="passage-para-num">¶${i + 1}</span>${para}</p>`;
  });
  document.getElementById('passageBody').innerHTML = html;
}

let mobileShowingPassages = false;
function toggleMobileView() {
  mobileShowingPassages = !mobileShowingPassages;
  document.getElementById('passagePanel').classList.toggle('mobile-show', mobileShowingPassages);
  document.getElementById('questionPanel').classList.toggle('mobile-hide', mobileShowingPassages);
  document.getElementById('mobileToggleBtn').textContent = mobileShowingPassages ? '✏️ Show Questions' : '📄 Show Passages';
}

const config = { topic: 'trash and recycling' };

// state.answers[sectionKey] = array of raw strings, same length as that section's questions
// state.completed[sectionKey] = true once finished at least once
const state = {
  answers: {},
  completed: {},
};
SECTIONS.forEach(s => {
  state.answers[s.key] = new Array(s.questions.length).fill('');
  state.completed[s.key] = false;
});

let route = { screen: 'home' }; // {screen:'home'} | {screen:'question', section, index} | {screen:'result', section} | {screen:'essay'}

const app = document.getElementById('app');
const pageTitle = document.getElementById('pageTitle');
const pageSubtitle = document.getElementById('pageSubtitle');

function cleanSentence(s) {
  s = s.split(/\r?\n/).map(line => line.replace(/^\s*[•*-]\s+/, '')).join(' ').replace(/\s{2,}/g, ' ').trim();
  if (s.length === 0) return s;
  s = s.charAt(0).toUpperCase() + s.slice(1);
  if (!/[.!?"'\u201D\u2019]$/.test(s)) s += '.';
  return s;
}

function stripQuoted(s) {
  return s.replace(/["'\u201C\u201D\u2018\u2019][^"'\u201C\u201D\u2018\u2019]*["'\u201C\u201D\u2018\u2019]/g, '');
}

function countSentenceEnds(s) {
  const outside = stripQuoted(s);
  const trimmed = outside.trim().replace(/[.!?]+$/, '');
  const matches = trimmed.match(/[.!?]/g);
  return matches ? matches.length : 0;
}

function sectionByKey(key) {
  return SECTIONS.find(s => s.key === key);
}

function assembledTextForSection(key) {
  return state.answers[key].map(cleanSentence).join(' ');
}

function sectionStatus(key) {
  if (state.completed[key]) return 'complete';
  const hasAny = state.answers[key].some(a => a.trim().length > 0);
  return hasAny ? 'progress' : 'not-started';
}

function goHome() { route = { screen: 'home' }; render(); }
function goQuestion(key, index) { route = { screen: 'question', section: key, index }; render(); }
function goResult(key) { route = { screen: 'result', section: key }; render(); }
function goEssay() { route = { screen: 'essay' }; render(); }

function applyTopic(text) {
  return text.replace(/\{\{TOPIC\}\}/g, config.topic || 'this issue');
}

function render() {
  if (route.screen === 'setup') return renderSetup();
  if (route.screen === 'home') return renderHome();
  if (route.screen === 'question') return renderQuestion(route.section, route.index);
  if (route.screen === 'result') return renderResult(route.section);
  if (route.screen === 'essay') return renderEssay();
}

function renderSetup() {
  pageTitle.textContent = 'Before You Start';
  pageSubtitle.textContent = 'One quick thing to set up for today\'s topic.';

  let html = `<div class="card">
      <div class="q-label">Today's Topic</div>
      <div class="q-text">What's the general issue these passages are about?</div>
      <div class="sentence-hint">A short phrase is fine — for example: "trash and recycling," "Daylight Saving Time," "school start times."</div>
      <textarea id="topicInput" placeholder="Type the topic here..." style="min-height:50px"></textarea>
      <div class="error" id="topicError">Type a topic before continuing.</div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="confirmTopic()">Continue</button>
      </div>
    </div>`;
  app.innerHTML = html;
}

function confirmTopic() {
  const val = document.getElementById('topicInput').value.trim();
  if (val.length < 2) {
    document.getElementById('topicError').classList.add('show');
    return;
  }
  config.topic = val;
  goHome();
}

function renderHome() {
  pageTitle.textContent = 'Build Your Essay';
  pageSubtitle.textContent = 'Pick a paragraph to work on. Answer in your own words — no wrong answers.';

  let html = `<div class="save-warning">
      <div class="warning-title">⚠️ Before You Start</div>
      <ul>
        <li>Nothing here is saved automatically.</li>
        <li>Your mobile device will NOT warn you before you lose your work.</li>
        <li>Copy each paragraph the moment you finish it.</li>
        <li>Paste it somewhere safe — an email, a Google Doc, or a text to yourself.</li>
      </ul>
    </div>`;

  html += `<div class="info-box">
      <div class="info-title">Good to Know</div>
      <ul>
        <li>A complete essay has 5 paragraphs: Introduction, Body Paragraph 1, Body Paragraph 2, Counterargument, and Conclusion.</li>
        <li>You can start with any paragraph — you don't have to go in order.</li>
        <li>Answer in your own words. There are no wrong answers.</li>
      </ul>
    </div>`;

  html += '<div class="section-list">';
  SECTIONS.forEach(s => {
    const status = sectionStatus(s.key);
    const statusLabel = status === 'complete' ? 'Done ✓' : status === 'progress' ? 'In progress' : 'Not started';
    const cardClass = status === 'complete' ? 'section-card complete' : 'section-card';
    const statusClass = status === 'complete' ? 'section-status complete' : status === 'progress' ? 'section-status progress' : 'section-status';
    html += `
      <div class="${cardClass}" onclick="goQuestion('${s.key}', 0)">
        <div class="section-name">${s.label}</div>
        <div class="${statusClass}">${statusLabel}</div>
      </div>`;
  });
  html += '</div>';
  html += `<button class="essay-btn" onclick="goEssay()">See My Whole Essay So Far</button>`;
  app.innerHTML = html;
}

function renderQuestion(key, index) {
  const section = sectionByKey(key);
  const q = section.questions[index];
  pageTitle.textContent = section.label;
  pageSubtitle.textContent = `Question ${index + 1} of ${section.questions.length}`;

  const savedVal = state.answers[key][index] || '';
  const priorText = index > 0 ? state.answers[key].slice(0, index).map(cleanSentence).join(' ') : '';

  let html = `<span class="back-link" onclick="goHome()">← Back to overview</span>`;
  html += `<div class="dots">`;
  for (let i = 0; i < section.questions.length; i++) {
    let cls = 'dot';
    if (i < index) cls += ' done';
    if (i === index) cls += ' active';
    html += `<div class="${cls}"></div>`;
  }
  html += `</div>`;

  html += `<div class="preview-box ${(priorText || savedVal) ? 'show' : ''}" id="previewBox">
      <div class="preview-label">Your paragraph so far</div>
      ${priorText ? `<span>${escapeHtml(priorText)}</span> ` : ''}<span class="preview-draft" id="previewDraft">${escapeHtml(savedVal)}</span>
    </div>`;

  html += `<div class="card">
      <div class="q-label">${section.label} — Part ${index + 1}</div>
      <div class="q-text">${applyTopic(q.q)}</div>`;
  html += q.isQuote
    ? `<div class="quote-note">${q.hint}</div>`
    : `<div class="sentence-hint">${q.hint}</div>`;
  html += `<textarea id="qInput" placeholder="Type your answer here...">${escapeHtml(savedVal)}</textarea>
      <div class="error" id="qError">Type an answer before moving on.</div>
      <div class="multi-warning" id="qWarning">This looks like more than one sentence${q.isQuote ? ', or the quoted part may be too long' : ''}. Try saying it in just one.</div>
      <div class="btn-row">
        ${index > 0 ? `<button class="btn btn-secondary" onclick="questionBack('${key}', ${index})">Back</button>` : ''}
        <button class="btn btn-primary" onclick="questionNext('${key}', ${index})">${index === section.questions.length - 1 ? 'Build This Paragraph' : 'Next'}</button>
      </div>
    </div>`;

  app.innerHTML = html;

  const input = document.getElementById('qInput');
  const lengthLimit = q.isQuote ? 260 : 220;
  input.addEventListener('input', () => {
    const val = input.value;
    document.getElementById('previewDraft').textContent = val;
    const warn = document.getElementById('qWarning');
    if (countSentenceEnds(val) >= 1 || val.length > lengthLimit) warn.classList.add('show');
    else warn.classList.remove('show');
    document.getElementById('previewBox').classList.add('show');
  });
}

function questionBack(key, index) {
  const val = document.getElementById('qInput').value;
  state.answers[key][index] = val;
  goQuestion(key, index - 1);
}

function questionNext(key, index) {
  const val = document.getElementById('qInput').value.trim();
  if (val.length < 3) {
    document.getElementById('qError').classList.add('show');
    return;
  }
  state.answers[key][index] = val;
  const section = sectionByKey(key);
  if (index === section.questions.length - 1) {
    state.completed[key] = true;
    goResult(key);
  } else {
    goQuestion(key, index + 1);
  }
}

function renderResult(key) {
  const section = sectionByKey(key);
  pageTitle.textContent = section.label + ' — Done';
  pageSubtitle.textContent = 'Here it is, all put together.';

  const fullText = assembledTextForSection(key);

  let html = `<span class="back-link" onclick="goHome()">← Back to overview</span>`;
  html += `<div class="save-warning">
      <div class="warning-title">⚠️ Copy This Now</div>
      <ul>
        <li>Your mobile device will NOT warn you before this disappears.</li>
        <li>Closing the tab or letting it lock loses it for good.</li>
      </ul>
    </div>`;
  html += `<div class="result-card">
      <div class="result-title">Tap inside the box, then Select All and Copy</div>
      <textarea class="result-para" id="assembled" readonly onclick="this.focus();this.select();">${escapeHtml(fullText)}</textarea>
    </div>
    <button class="copy-btn" id="copyBtn" onclick="copyText()">Copy this paragraph</button>
    <div class="copy-help">Paste it into an email, a Google Doc, or wherever you're keeping your essay — right now, before you do anything else.</div>`;

  html += `<div class="reveal-title">You just wrote all ${section.questions.length} parts</div>`;
  section.questions.forEach((q, i) => {
    html += `<div class="reveal-row"><div class="reveal-tag">${q.tag}</div><div class="reveal-txt">${escapeHtml(cleanSentence(state.answers[key][i]))}</div></div>`;
  });

  html += `<button class="text-btn" onclick="goQuestion('${key}', 0)">Redo this paragraph</button>`;
  html += `<button class="essay-btn" onclick="goEssay()" style="margin-top:1rem">See My Whole Essay So Far</button>`;

  window.__fullText = fullText;
  app.innerHTML = html;
}

function renderEssay() {
  pageTitle.textContent = 'Your Whole Essay So Far';
  pageSubtitle.textContent = 'Everything you\'ve finished, all in one place.';

  let html = `<span class="back-link" onclick="goHome()">← Back to overview</span>`;
  html += `<div class="save-warning">
      <div class="warning-title">⚠️ Copy Everything Now</div>
      <ul>
        <li>Your mobile device will NOT warn you before this disappears.</li>
        <li>Nothing here is saved automatically.</li>
      </ul>
    </div>`;

  const missing = SECTIONS.filter(s => !state.completed[s.key]);
  if (missing.length > 0) {
    html += `<div class="essay-missing">Not finished yet: ${missing.map(s => s.label).join(', ')}. Those parts aren't included below.</div>`;
  }

  const finished = SECTIONS.filter(s => state.completed[s.key]);
  let combined = '';
  finished.forEach(s => { combined += assembledTextForSection(s.key) + '\n\n'; });
  combined = combined.trim();

  html += `<div class="result-card">
      <div class="result-title">Tap inside the box, then Select All and Copy</div>
      <textarea class="result-para" id="assembled" readonly style="min-height:260px" onclick="this.focus();this.select();">${escapeHtml(combined)}</textarea>
    </div>
    <button class="copy-btn" id="copyBtn" onclick="copyText()">Copy my whole essay</button>
    <div class="copy-help">If the button doesn't work, tap inside the box above, then use your mobile device's Select All and Copy.</div>`;

  window.__fullText = combined;
  app.innerHTML = html;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

function copyText() {
  const btn = document.getElementById('copyBtn');
  const ta = document.getElementById('assembled');
  const text = window.__fullText || '';
  const done = () => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = btn.dataset.label || 'Copy'; btn.classList.remove('copied'); }, 1800);
  };
  btn.dataset.label = btn.textContent;

  ta.focus();
  ta.setSelectionRange(0, ta.value.length);

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => {
      try { document.execCommand('copy'); done(); } catch (e) { /* text stays selected for manual copy */ }
    });
  } else {
    try { document.execCommand('copy'); done(); } catch (e) { /* text stays selected for manual copy */ }
  }
}

function hasAnyUnsavedWork() {
  return SECTIONS.some(s => state.answers[s.key].some(a => a.trim().length > 0));
}

window.addEventListener('beforeunload', (e) => {
  if (hasAnyUnsavedWork()) {
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});

showPassage('pro');
render();
</script>
</body>
</html>
